name: vhs

# Run from the repository root so Compose reads the root .env:
#   docker compose --env-file .env -f config/docker-compose.yml up -d --build
# Published ports listen on 127.0.0.1 only. For phone access over your LAN set
# BIND_ADDR=0.0.0.0 in .env (web ports only; Ollama and Postgres stay local).

services:

  web:
    build: ..
    env_file: ../.env
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-8082}:8080"
      - "${BIND_ADDR:-127.0.0.1}:${HTTPS_PORT:-8443}:8443"
    volumes:
      - certs:/app/certs
    depends_on:
      ollama:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── GPU / native-Windows Ollama variant ────────────────────────────────
  # Run only this service when using native Windows Ollama (DirectML/CUDA):
  #   OLLAMA_UPSTREAM=http://host.docker.internal:11434 docker compose up web-gpu
  web-gpu:
    build: ..
    profiles: [gpu]
    env_file: ../.env
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-8082}:8080"
    environment:
      - OLLAMA_UPSTREAM=${OLLAMA_UPSTREAM}
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      # Empty keeps Ollama's localhost-only default; the app's own proxy needs nothing more.
      - OLLAMA_ORIGINS=${OLLAMA_ORIGINS:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 8s
      timeout: 5s
      retries: 20
      start_period: 15s
  #GPU Support on Linux
  #  deploy:
  #    resources:
  #      reservations:
  #        devices:
  #          - driver: nvidia
  #            count: all
  #            capabilities: [gpu]

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vhs-db
      POSTGRES_USER: neondb_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env and pass --env-file .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neondb_owner -d vhs-db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ── Public HTTPS tunnel (opt-in) ──────────────────────────────────────────
  # Off by default. It puts the app on the public internet at a random
  # *.trycloudflare.com HTTPS URL, so configure Google sign-in first; open
  # single-user mode is refused for tunnelled requests.
  #   docker compose --env-file .env -f config/docker-compose.yml --profile tunnel up -d
  # URL is printed in logs: docker compose logs cloudflared | grep trycloudflare
  # For a stable URL, replace with a named Cloudflare Tunnel (needs CF account).
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate --url http://web:8080
    depends_on:
      - web
    restart: unless-stopped

  # One-shot: pulls the vision model on first run, skips if already cached.
  ollama-pull:
    image: ollama/ollama:latest
    env_file: ../.env
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${OLLAMA_MODEL:-llava:7b} && echo '✓ Model ready'"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  ollama_models:
  certs:
  pgdata:
