# Static front-end lives in public/; backend routes are served via Netlify Functions.
[build]
  publish = "public"
  functions = "netlify/functions"

# Include migrations dir in the function bundle (loaded via fs.readdirSync at runtime)
# Every production deploy costs Netlify credits, so skip the ones that cannot change
# what is served (docs, tests, CI config, promo assets). Exit 0 = no relevant changes =
# skip; an empty CACHED_COMMIT_REF or COMMIT_REF is guarded explicitly (exit 1 = build), so it fails open.
# Production only: deploy previews are free and stay on for review.
[context.production]
  ignore = "test -n \"$CACHED_COMMIT_REF\" && test -n \"$COMMIT_REF\" && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ':(exclude)docs' ':(exclude)tests' ':(exclude)tests_playwright' ':(exclude)promo' ':(exclude)site' ':(exclude).github' ':(exclude)test-results' ':(exclude)*.md'"
[functions]
  included_files = ["migrations/**"]

# Route all backend paths to the Express function
[[redirects]]
  from = "/api/*"
  to   = "/.netlify/functions/server/:splat"
  status = 200

[[redirects]]
  from = "/auth/*"
  to   = "/.netlify/functions/server/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to   = "/.netlify/functions/server"
  status = 200

# Public share URLs — serve the SPA; client-side JS handles /c/:slug routing
[[redirects]]
  from = "/c/*"
  to   = "/index.html"
  status = 200
