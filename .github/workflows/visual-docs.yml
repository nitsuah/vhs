name: Visual docs

# Regenerates docs/screenshots/<feature-id>.png from the journeys
# (tests/journeys, steps tagged { docs: '<id>' }) — same demo seed, mocked
# API and frozen clock, so there is one Playwright suite, not two — renders
# docs/diagrams/*.mmd to .svg, rewrites the README's visual-docs block, and
# opens/updates a PR on bot/visual-docs. Never pushes to main. Recipe:
# nitsuah/vigil docs/VISUAL_DOCS.md; promo/spots.json links the images by id.
#
# One-time repo setting: Settings -> Actions -> General -> "Allow GitHub
# Actions to create and approve pull requests".

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'tests/journeys/**'
      - 'promo/demo-seed.js'
      - 'promo/demo-mocks.js'
      # Sources only: the rendered .svg comes back in the bot PR.
      - 'docs/diagrams/**/*.mmd'
      - 'docs/diagrams/mermaid.config.json'
      - 'scripts/visual-docs-readme.mjs'
      - '.github/workflows/visual-docs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: visual-docs
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: mkdir -p docs/screenshots && npm run capture:screenshots
        env:
          CI: true

      - name: Render diagrams
        # mermaid-cli drives Chromium through Puppeteer; reuse Playwright's
        # browser instead of downloading a second one.
        run: |
          CHROME=$(node -p "require('playwright-core').chromium.executablePath()")
          printf '{"executablePath":"%s","args":["--no-sandbox"]}' "$CHROME" > "$RUNNER_TEMP/puppeteer.json"
          for f in docs/diagrams/*.mmd; do
            npx -y @mermaid-js/mermaid-cli@12.0.0 -p "$RUNNER_TEMP/puppeteer.json" \
              -c docs/diagrams/mermaid.config.json -b white -i "$f" -o "${f%.mmd}.svg"
          done

      - name: Update README block
        run: node scripts/visual-docs-readme.mjs

      - name: Open or update PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bot/visual-docs
          delete-branch: true
          add-paths: |
            docs/diagrams/*.svg
            docs/screenshots/*.png
            README.md
          commit-message: 'docs: regenerate diagrams and screenshots'
          title: 'docs: regenerate diagrams and screenshots'
          body: |
            Regenerated by `.github/workflows/visual-docs.yml` after ${{ github.sha }}.
            Review the images, then merge. No code changes.
