name: Wall-view Playwright gate

on:
  push:
    branches: [fix/rebaseline-wall-view-playwright]
  pull_request:
    branches: [main]
    paths:
      - "tests_playwright/wall-view.spec.js"
      - ".github/workflows/wall-view-playwright.yml"

permissions:
  contents: read

jobs:
  wall-view:
    name: Docker Playwright wall-view spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run focused Playwright gate in Docker
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/app" \
            -w /app \
            mcr.microsoft.com/playwright:v1.65.0-noble \
            sh -c 'npm ci --no-audit --no-fund && (node tests/journeys/serve.js 8082 >/tmp/s.log 2>&1 & sleep 3; npx playwright test tests_playwright/wall-view.spec.js --workers=1 --reporter=line)'

      - name: Run focused ESLint gate in Docker
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/app" \
            -w /app \
            node:22 \
            sh -c "npm ci --no-audit --no-fund && npx eslint --config ./eslint.config.mjs tests_playwright/wall-view.spec.js"

      - name: Check patch formatting
        run: git diff --check
