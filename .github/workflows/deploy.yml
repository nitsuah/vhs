name: Deploy

# Deploys the Cloudflare Worker (vhs.nitsuah.io) after tests pass on main.
# Needs repo secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and
# CLOUDFLARE_ACCOUNT_ID. Worker secrets stay in Cloudflare (`wrangler secret put`).
# The vhs.nitsuah.io custom domain is attached in the Cloudflare dashboard, not
# in wrangler.jsonc, so the smoke check assumes it is already set up.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm test

  deploy:
    name: Deploy Worker
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are required to deploy"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke check
        run: |
          # 200 means the Worker and its database are both up; a 503 here
          # usually means a missing Worker secret or a database outage.
          code=none
          for _ in 1 2 3 4 5; do
            code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' https://vhs.nitsuah.io/api/health || echo none)
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::/api/health returned $code after deploy"
          exit 1
